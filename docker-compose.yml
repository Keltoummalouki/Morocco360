services:
  postgres:
    image: postgres:16-alpine
    container_name: eventhub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: eventhub_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      NODE_ENV: ${NODE_ENV}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      # Social sign-in: the browser and the providers reach the API on this URL,
      # so it must be the published host port, not the Docker network name.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      # Hot reload on Windows host: tsc watch polling is configured via
      # watchOptions in api/tsconfig.json. This env var is a harmless fallback.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./api/src:/app/src
      - ./api/tsconfig.json:/app/tsconfig.json
      - ./api/nest-cli.json:/app/nest-cli.json
      - api_node_modules:/app/node_modules
    healthcheck:
      # /health/ready checks only "app up + database reachable" — the signal
      # web actually depends on. Plain /health also enforces memory ceilings a
      # dev-mode watcher can drift past, which would wrongly mark api unhealthy.
      # start_period covers the initial `nest start:dev` TypeScript compile,
      # so the slow first build is not counted as a failure.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4000/health/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: eventhub_web
    restart: unless-stopped
    # Use Webpack (not the default Turbopack) inside Docker: Turbopack's file
    # watcher — even with polling — does not reliably detect edits across the
    # Windows/OneDrive bind mount, whereas Webpack polling (WATCHPACK_POLLING +
    # watchOptions.pollIntervalMs) does. Host `npm run dev` still uses Turbopack.
    command: ["npx", "next", "dev", "--webpack", "--port", "4001"]
    ports:
      - "4001:4001"
    environment:
      # Server-side calls go through the Docker network
      API_URL: http://api:4000
      # The browser is redirected to the API for social sign-in, so this must be
      # the published host port rather than the Docker network name.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      # Client ids only (never the secrets) — used solely to decide which
      # "Continue with…" buttons to render.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      # Hot reload on the Windows/OneDrive bind mount relies on polling:
      # WATCHPACK_POLLING drives Webpack's watcher; watchOptions.pollIntervalMs
      # in web/next.config.ts sets the poll interval.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web/src:/app/src
      - ./web/next.config.ts:/app/next.config.ts
      - ./web/public:/app/public
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  # These shield the container's node_modules from the Windows bind mount, but
  # Docker only fills a named volume the first time it is created. After
  # changing package.json, a plain `docker compose build` leaves the old
  # modules in place and the app crashes with "Cannot find module ...".
  # Recreate them explicitly:
  #   docker compose down
  #   docker volume rm eventhub_api_node_modules eventhub_web_node_modules
  #   docker compose up -d --build
  api_node_modules:
  web_node_modules:
