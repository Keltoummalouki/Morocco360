services:
  - type: web
    name: morocco360-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_RUN_MIGRATIONS
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: QR_HMAC_SECRET
        generateValue: true
      # Public URL of the deployed web app. The social sign-in callback sends
      # the browser back here, so a stale localhost value strands real users on
      # their own machine. Boot fails if it is missing or localhost.
      - key: FRONTEND_URL
        sync: false
      # Public URL of *this* service (https://<name>.onrender.com). Used to
      # build the OAuth callback the providers redirect to, so it must match
      # the redirect URI registered with Google/Facebook exactly.
      - key: API_PUBLIC_URL
        sync: false
      # Social sign-in. Each pair is all-or-nothing: set both keys to enable a
      # provider, or leave both unset to hide its button. Half a pair fails
      # validation at boot.
      #   Google:   {API_PUBLIC_URL}/auth/google/callback
      #   Facebook: {API_PUBLIC_URL}/auth/facebook/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
